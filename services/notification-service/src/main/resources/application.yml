spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/sunridge_notification?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: 8084

services:
  commerce:
    base-url: ${COMMERCE_SERVICE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:local-development-internal-key}

notifications:
  from: ${NOTIFICATION_FROM:orders@sunridge.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info

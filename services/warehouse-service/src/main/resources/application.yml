spring:
  application:
    name: warehouse-service
  datasource:
    url: jdbc:mysql://localhost:3306/sunridge_warehouse?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

server:
  port: 8082

internal:
  # Use a unique secret from a secret manager outside local development.
  api-key: ${INTERNAL_API_KEY:local-development-internal-key}

outbox:
  max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}

management:
  endpoints:
    web:
      exposure:
        include: health,info

name: Agent Service CI

on:
  pull_request:
    paths:
      - "agent-service/**"
      - ".github/workflows/agent-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "agent-service/**"
      - ".github/workflows/agent-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build agent image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-service

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate application imports
        run: |
          python -m compileall -q app
          python -c "from app.main import app; assert app.title == 'Ecommerce AI Agent'"

      - name: Build deployment image
        run: docker build --tag ecommerce-agent:${{ github.sha }} .

spring:
  datasource:
    url: ${COMMERCE_DB_URL:jdbc:mysql://localhost:3306/sunridge_commerce?useSSL=false&serverTimezone=UTC}
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,beans,conditions

app:
  frontend-url: http://localhost:5173
  jwt-secret: ${JWT_SECRET:}
  oauth:
    enabled: false

services:
  warehouse:
    base-url: ${WAREHOUSE_SERVICE_URL:http://localhost:8082}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
